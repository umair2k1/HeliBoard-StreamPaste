name: Build and release debug APK

"on":
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional release tag; generated automatically when omitted
        required: false
        type: string
  push:
    tags:
      - 'streampaste-*'
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeliBoard-StreamPaste-debug
          path: app/build/outputs/apk/debug/*-debug*.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag || format('streampaste-{0}', github.run_number) }}
          name: HeliBoard StreamPaste ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag || format('streampaste-{0}', github.run_number) }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: app/build/outputs/apk/debug/*-debug*.apk

      - name: Archive reports for failed job
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '*/build/reports'
        if: ${{ failure() }}
